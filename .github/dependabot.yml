version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Let new releases age before proposing them (supply-chain safety).
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # Let new releases age before proposing them (supply-chain safety).
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      # Model libraries (torch, transformers) are pinned deliberately; review them
      # individually instead of in a grouped update.
      development:
        dependency-type: development
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns:
          - torch
          - torchaudio
          - transformers
