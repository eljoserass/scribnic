name = "bonsai_4b_note"
inputs = ["transcript", "diarized_transcript"]
default_output = "note"
download_missing = true

[steps.note]
backend = "openai_chat"
model = "Ternary-Bonsai-2-4B-PQ2_0"
runtime = "llama_cpp_prism"
template = "soap_es"

# Use Prism's recommended non-thinking sampling profile.
[steps.note.model_settings]
temperature = 0.7

[steps.note.runtime_settings]
context_size = 8192
