name = "nvidia_cpp_asr_offline"
inputs = ["audio", "transcript", "diarized_transcript"]
default_output = "note"
download_missing = true

[steps.speech]
backend = "openai_transcription"
model = "nemotron-3.5-asr-streaming-0.6b.q8_0"
runtime = "nemo_cpp"
output = "transcript"

[steps.speech.model_settings]
mode = "offline"
language = "es-ES"

[steps.note]
backend = "openai_chat"
model = "Ternary-Bonsai-2-2B-PQ2_0"
runtime = "llama_cpp_prism"
template = "soap_es"
source = "speech"

[steps.note.model_settings]
temperature = 0.0
