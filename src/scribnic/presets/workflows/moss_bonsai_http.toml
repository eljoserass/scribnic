name = "moss_bonsai_http"
inputs = ["audio", "transcript", "diarized_transcript"]
default_output = "note"
download_missing = true

[steps.speech]
backend = "moss_transcribe_diarize"
model = "moss_transcribe_diarize"
runtime = "transformers"

[steps.note]
backend = "openai_chat"
model = "Ternary-Bonsai-2-2B-PQ2_0"
runtime = "external_endpoint"
template = "soap_es"
source = "speech"
