# License: Apache-2.0. Original OpenMOSS checkpoint; no low-bit quantization.
name = "moss_transcribe_diarize"
inputs = ["audio"]
output = "diarized_transcript"
repository = "OpenMOSS-Team/MOSS-Transcribe-Diarize"
revision = "704aa4a9c304e8520be88901e0d1960158ef5b15"
filename = "model-00000-of-00001.safetensors"
quantization = "BF16"

[settings]
# TODO(eval): compare medical hotword hints against the default prompt.
# Preserve the full official timestamped diarization instructions when overriding
# prompt; append vocabulary hints instead of replacing those instructions.
max_tokens = 16384
min_tokens_budget = 2048
tokens_per_second = 12
required_files = [
  "config.json", "model-00000-of-00001.safetensors",
  "model.safetensors.index.json", "modeling_moss_transcribe_diarize.py",
  "configuration_moss_transcribe_diarize.py", "processing_moss_transcribe_diarize.py",
  "preprocessor_config.json", "processor_config.json", "tokenizer.json",
  "tokenizer_config.json", "special_tokens_map.json", "chat_template.jinja",
]
