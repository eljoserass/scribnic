[project]
name = "scribnic"
version = "0.1.0"
description = "Configurable local clinical note workflows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "openai>=2,<3",
    "opentelemetry-api~=1.45.1",
    "opentelemetry-sdk~=1.45.1",
    "opentelemetry-exporter-otlp-json-file==0.66b1",
    "opentelemetry-instrumentation-system-metrics==0.66b1",
    "psutil>=7,<8",
    "typer>=0.27,<0.28",
    "rich>=15,<16",
]

[project.optional-dependencies]
streaming = ["websockets>=15,<17"]
moss = [
    "accelerate>=1,<2",
    "huggingface-hub>=1,<2",
    "numpy>=1.26,<3",
    "torch>=2.8,<3",
    "transformers>=5,<6",
]
moss-audio = [
    "accelerate>=1,<2",
    "huggingface-hub>=0.34,<1",
    "numpy>=2,<3",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers==4.57.1",
    "tiktoken>=0.12,<1",
    "einops>=0.8,<1",
]

[dependency-groups]
dev = ["ruff>=0.15,<1"]

[tool.uv]
conflicts = [[{extra = "moss"}, {extra = "moss-audio"}]]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'", "sys_platform == 'win32'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.scripts]
scribnic = "scribnic.cli:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
